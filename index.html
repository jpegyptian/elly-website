<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Elly Tech - Technology Solutions">
    <title>Elly Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            padding: 24px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 48px;
        }

        .status {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 9999px;
            color: #60a5fa;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link {
            padding: 12px 24px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .link:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .link.secondary {
            background: transparent;
            border: 1px solid #475569;
            color: #cbd5e1;
        }

        .link.secondary:hover {
            border-color: #3b82f6;
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ============================================
             EDIT YOUR HOMEPAGE CONTENT HERE
        ============================================= -->

        <h1 class="logo">Elly Tech</h1>
        <p class="tagline">Technology Solutions</p>

        <div class="status">Coming Soon</div>

        <div class="links">
            <a href="/about-joseph" class="link">About Joseph</a>
            <a href="mailto:joehoregy2@gmail.com" class="link secondary">Contact</a>
        </div>
    </div>
</body>
</html>
